<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ardiansyah APP</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f5f9;
    color: #1e293b;
    padding: 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

header {
    background: #2563eb;
    color: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 20px;
}

header h1 {
    margin-bottom: 8px;
}

.summary {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
}

.card, .panel {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #0001;
}

.card {
    flex: 1;
}

.card h2 {
    color: #2563eb;
    margin-top: 10px;
}

.panel {
    margin-bottom: 20px;
}

.panel h2 {
    margin-bottom: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.field label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
    font-size: 14px;
}

.field input, .field select {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
}

.full {
    grid-column: 1 / -1;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.primary { background: #2563eb; }
.secondary { background: #64748b; }
.edit { background: #f59e0b; margin: 2px; }
.delete { background: #dc2626; margin: 2px; }

.search {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    margin-bottom: 15px;
}

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 750px;
    border-collapse: collapse;
}

th, td {
    padding: 13px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
    font-size: 14px;
}

th {
    background: #eff6ff;
    color: #1d4ed8;
}

.empty {
    text-align: center;
    padding: 20px;
    color: #64748b;
}

footer {
    text-align: center;
    padding: 20px;
    color: #64748b;
    font-size: 13px;
}

@media(max-width:600px) {
    body { padding: 10px; }
    .summary { flex-direction: column; }
    .form-grid { grid-template-columns: 1fr; }
    .full { grid-column: auto; }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>🎓 Ardiansyah APP</h1>
    <p>Aplikasi Manajemen Data Siswa</p>
    <p>Kelola data siswa dengan mudah dan praktis.</p>
</header>

<div class="summary">
    <div class="card">
        <p>Total Data Siswa</p>
        <h2 id="totalSiswa">0</h2>
    </div>

    <div class="card">
        <p>Total Kelas</p>
        <h2 id="totalKelas">0</h2>
    </div>
</div>

<div class="panel">
    <h2 id="judulForm">Tambah Data Siswa</h2>

    <form id="formSiswa">
        <div class="form-grid">

            <div class="field">
                <label>NIS</label>
                <input type="text" id="nis"
                    placeholder="Masukkan NIS" required>
            </div>

            <div class="field">
                <label>Nama Lengkap</label>
                <input type="text" id="nama"
                    placeholder="Masukkan nama siswa" required>
            </div>

            <div class="field">
                <label>Kelas</label>
                <input type="text" id="kelas"
                    placeholder="Contoh: XII TKJ 3" required>
            </div>

            <div class="field">
                <label>Jurusan</label>
                <select id="jurusan" required>
                    <option value="">Pilih Jurusan</option>
                    <option value="TKJ">TKJ</option>
                    <option value="RPL">RPL</option>
                    <option value="Multimedia">Multimedia</option>
                    <option value="DKV">DKV</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>

            <div class="field">
                <label>Jenis Kelamin</label>
                <select id="jk" required>
                    <option value="">Pilih Jenis Kelamin</option>
                    <option value="Laki-laki">Laki-laki</option>
                    <option value="Perempuan">Perempuan</option>
                </select>
            </div>

            <div class="field">
                <label>Nomor HP</label>
                <input type="tel" id="hp"
                    placeholder="Masukkan nomor HP">
            </div>

            <div class="field full">
                <button type="submit" class="primary" id="tombolSimpan">
                    + Simpan Data
                </button>
                <button type="button" class="secondary"
                    onclick="resetForm()">Batal / Reset</button>
            </div>

        </div>
    </form>
</div>

<div class="panel">
    <h2>Daftar Data Siswa</h2>

    <input type="text" class="search" id="cari"
        placeholder="🔍 Cari nama, NIS, kelas atau jurusan...">

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>NIS</th>
                    <th>Nama</th>
                    <th>Kelas</th>
                    <th>Jurusan</th>
                    <th>Jenis Kelamin</th>
                    <th>Nomor HP</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <tbody id="tabelSiswa"></tbody>
        </table>
    </div>
</div>

<footer>
    <p>© 2026 Ardiansyah APP | Manajemen Data Siswa</p>
</footer>

</div>

<script>

// Mengambil data dari LocalStorage
let siswa = JSON.parse(
    localStorage.getItem("dataSiswa")
) || [];

let indexEdit = -1;

// Menyimpan data
function simpanStorage() {
    localStorage.setItem(
        "dataSiswa",
        JSON.stringify(siswa)
    );
}

// Menampilkan data siswa
function tampilkanData() {
    const tabel = document.getElementById("tabelSiswa");
    const keyword = document.getElementById("cari")
        .value.toLowerCase();

    tabel.innerHTML = "";

    const hasil = siswa.filter(s =>
        [s.nis, s.nama, s.kelas, s.jurusan, s.jk, s.hp]
        .some(v => String(v).toLowerCase().includes(keyword))
    );

    if (hasil.length === 0) {
        tabel.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    Data siswa tidak ditemukan.
                </td>
            </tr>
        `;
    }

    hasil.forEach((s, i) => {
        const indexAsli = siswa.indexOf(s);

        tabel.innerHTML += `
            <tr>
                <td>${i + 1}</td>
                <td>${escapeHTML(s.nis)}</td>
                <td>${escapeHTML(s.nama)}</td>
                <td>${escapeHTML(s.kelas)}</td>
                <td>${escapeHTML(s.jurusan)}</td>
                <td>${escapeHTML(s.jk)}</td>
                <td>${escapeHTML(s.hp)}</td>
                <td>
                    <button class="edit"
                        onclick="editData(${indexAsli})">
                        Edit
                    </button>
                    <button class="delete"
                        onclick="hapusData(${indexAsli})">
                        Hapus
                    </button>
                </td>
            </tr>
        `;
    });

    document.getElementById("totalSiswa")
        .textContent = siswa.length;

    const kelasUnik = new Set(
        siswa.map(s => s.kelas.toLowerCase())
    );

    document.getElementById("totalKelas")
        .textContent = kelasUnik.size;
}

// Mengamankan teks sebelum ditampilkan
function escapeHTML(teks) {
    return String(teks).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

// Tambah dan edit data
document.getElementById("formSiswa")
.addEventListener("submit", function(e) {
    e.preventDefault();

    const data = {
        nis: document.getElementById("nis").value.trim(),
        nama: document.getElementById("nama").value.trim(),
        kelas: document.getElementById("kelas").value.trim(),
        jurusan: document.getElementById("jurusan").value,
        jk: document.getElementById("jk").value,
        hp: document.getElementById("hp").value.trim()
    };

    if (!data.nis || !data.nama || !data.kelas ||
        !data.jurusan || !data.jk) {
        alert("Mohon lengkapi data wajib!");
        return;
    }

    const duplikat = siswa.some((s, i) =>
        s.nis.toLowerCase() === data.nis.toLowerCase()
        && i !== indexEdit
    );

    if (duplikat) {
        alert("NIS sudah terdaftar!");
        return;
    }

    if (indexEdit === -1) {
        siswa.push(data);
        alert("Data siswa berhasil ditambahkan!");
    } else {
        siswa[indexEdit] = data;
        alert("Data siswa berhasil diperbarui!");
    }

    simpanStorage();
    resetForm();
    tampilkanData();
});

// Edit data
function editData(index) {
    const s = siswa[index];

    document.getElementById("nis").value = s.nis;
    document.getElementById("nama").value = s.nama;
    document.getElementById("kelas").value = s.kelas;
    document.getElementById("jurusan").value = s.jurusan;
    document.getElementById("jk").value = s.jk;
    document.getElementById("hp").value = s.hp;

    indexEdit = index;

    document.getElementById("judulForm")
        .textContent = "Edit Data Siswa";

    document.getElementById("tombolSimpan")
        .textContent = "Update Data";

    window.scrollTo({top: 0, behavior: "smooth"});
}

// Hapus data
function hapusData(index) {
    const yakin = confirm(
        "Apakah Anda yakin ingin menghapus data siswa ini?"
    );

    if (yakin) {
        siswa.splice(index, 1);
        simpanStorage();
        tampilkanData();
        resetForm();
        alert("Data berhasil dihapus!");
    }
}

// Reset form
function resetForm() {
    document.getElementById("formSiswa").reset();

    indexEdit = -1;

    document.getElementById("judulForm")
        .textContent = "Tambah Data Siswa";

    document.getElementById("tombolSimpan")
        .textContent = "+ Simpan Data";
}

// Pencarian data
document.getElementById("cari")
.addEventListener("input", tampilkanData);

// Jalankan aplikasi
tampilkanData();

</script>

</body>
</html>
